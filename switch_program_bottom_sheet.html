<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Switch Program — Caseflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface": "#f9f9f7",
            "surface-dim": "#dadad8",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f4f2",
            "surface-container": "#eeeeec",
            "surface-container-high": "#e8e8e6",
            "on-surface": "#1a1c1b",
            "on-surface-variant": "#444748",
            "primary": "#161616",
            "secondary": "#9a442d",
            "outline": "#747878"
          },
          borderRadius: {
            DEFAULT: "1rem",
            full: "9999px"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: rgba(26, 28, 27, 0.55);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-end p-0 sm:p-4">
  <!-- Bottom Sheet Container -->
  <div class="w-full max-w-md mx-auto bg-surface-container-lowest rounded-t-[28px] sm:rounded-b-[28px] p-6 shadow-[0_-12px_40px_rgba(0,0,0,0.18)] flex flex-col">
    <!-- Handle -->
    <div class="w-10 h-1 rounded-full bg-surface-dim mx-auto mb-5"></div>

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-[20px] font-extrabold text-primary tracking-tight">Switch program</h2>
        
      </div>
      <button aria-label="Close" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-outline hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>

    <!-- Programs list -->
    <div class="flex flex-col gap-2.5 my-2">
      <!-- Program 1: Currently Active -->
      <button class="w-full text-left p-4 rounded-DEFAULT bg-surface-container-low border-2 border-primary/20 flex items-center justify-between active:scale-[0.99] transition-all">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-white">
            <span class="material-symbols-outlined text-[18px]">check</span>
          </div>
          <div class="flex flex-col">
            <span class="text-[16px] font-bold text-primary">Youth Outreach</span>
            <span class="text-[12px] font-semibold uppercase tracking-wider text-secondary">Current</span>
          </div>
        </div>
        <span class="w-2.5 h-2.5 rounded-full bg-secondary"></span>
      </button>

      <!-- Program 2: Available to Switch -->
      <button class="w-full text-left p-4 rounded-DEFAULT bg-surface-container-lowest hover:bg-surface-container-low border border-surface-container flex items-center justify-between active:scale-[0.99] transition-all">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
            <span class="material-symbols-outlined text-[18px]">diversity_1</span>
          </div>
          <div class="flex flex-col">
            <span class="text-[16px] font-bold text-primary">Family Support</span>
            
          </div>
        </div>
        <span class="material-symbols-outlined text-[20px] text-outline">arrow_forward</span>
      </button>
    </div>

    <!-- Reassurance Footer -->
    <div class="mt-4 pt-3 border-t border-surface-container flex items-center text-[13px] text-outline justify-end">
      
      <button class="font-semibold text-primary hover:underline py-1">Cancel</button>
    </div>
  </div>




</body></html>
