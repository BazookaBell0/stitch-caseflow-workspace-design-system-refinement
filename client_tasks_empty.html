<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Tasks — Jordan M. — Caseflow</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f9f9f7",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f4f2",
            "surface-container": "#eeeeec",
            "surface-container-high": "#e8e8e6",
            "on-surface": "#1a1c1b",
            "on-surface-variant": "#444748",
            "outline": "#747878",
            "outline-variant": "#c4c7c7",
            "primary": "#161616",
            "on-primary": "#ffffff",
            "secondary": "#9a442d",
            "on-secondary": "#ffffff"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f9f9f7;
        color: #1a1c1b;
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body { overscroll-behavior-y: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen">
  <!-- Header: Contextual Navigation to Jordan M. -->
  <header class="fixed top-0 w-full z-40 pt-safe bg-surface/90 backdrop-blur-xl border-b border-surface-container">
    <div class="h-16 px-5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="#client-overview" class="min-h-[44px] min-w-[44px] -ml-2 flex items-center justify-center text-on-surface hover:text-primary active:scale-95 transition-transform" aria-label="Back to Jordan M.">
          <span class="material-symbols-outlined text-[22px]">arrow_back</span>
        </a>
        <div class="flex items-center gap-2">
          <span class="font-bold text-[17px] text-primary tracking-tight">Jordan M.</span>
          <span class="px-2.5 py-0.5 rounded-full bg-surface-container text-xs font-semibold text-on-surface-variant">Youth Outreach</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content: Empty State -->
  <main class="flex-1 w-full max-w-md mx-auto pt-20 pb-28 px-5 flex flex-col justify-center items-center text-center">
    <div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-4 text-outline">
      <span class="material-symbols-outlined text-[24px]">checklist</span>
    </div>
    <h1 class="text-xl font-bold text-primary tracking-tight mb-1.5">No open tasks</h1>
    <p class="text-sm text-on-surface-variant max-w-xs mb-6">There are no current commitments for Jordan.</p>
    
    <button class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-primary text-on-primary font-semibold text-sm shadow-sm hover:bg-[#2b2b2b] active:scale-95 transition-all">
      <span class="material-symbols-outlined text-[18px]">add</span>
      <span>Add task</span>
    </button>
  </main>

  <!-- Persistent Bottom Navigation: Caseload as Contextual Root -->
  <nav class="fixed bottom-0 w-full z-40 pb-safe px-5 pointer-events-none mb-3">
    <div class="max-w-md mx-auto pointer-events-auto h-16 bg-surface-container-lowest/90 backdrop-blur-xl rounded-full shadow-[0_16px_36px_-6px_rgba(26,28,27,0.08),0_4px_12px_-2px_rgba(26,28,27,0.03)] px-4 flex items-center justify-between border border-surface-container/60">
      <a class="min-h-[44px] min-w-[44px] flex-1 flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" href="#today">
        <span class="material-symbols-outlined text-[22px]">notifications_active</span>
        <span class="text-[10px] font-bold tracking-wide uppercase mt-0.5">Today</span>
      </a>
      <a aria-current="page" class="min-h-[44px] min-w-[44px] flex-1 flex flex-col items-center justify-center text-primary font-bold transition-colors" href="#caseload">
        <span class="material-symbols-outlined text-[22px]">folder_shared</span>
        <span class="text-[10px] font-bold tracking-wide uppercase mt-0.5">Caseload</span>
      </a>
      <div class="flex items-center justify-center px-1">
        <a class="min-h-[44px] min-w-[44px] w-12 h-12 rounded-full bg-secondary text-on-secondary shadow-[0_6px_16px_rgba(154,68,45,0.28)] flex items-center justify-center active:scale-95 transition-transform" href="#quick-capture-jordan" title="Quick Capture for Jordan M.">
          <span class="material-symbols-outlined text-[24px]">add</span>
        </a>
      </div>
      <a class="min-h-[44px] min-w-[44px] flex-1 flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" href="#tasks">
        <span class="material-symbols-outlined text-[22px]">checklist</span>
        <span class="text-[10px] font-bold tracking-wide uppercase mt-0.5">Tasks</span>
      </a>
    </div>
  </nav>
</body>
</html>
