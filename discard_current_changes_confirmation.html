<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Discard Current Changes Confirmation — Caseflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface": "#f9f9f7",
            "surface-dim": "#dadad8",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f4f2",
            "surface-container": "#eeeeec",
            "surface-container-high": "#e8e8e6",
            "on-surface": "#1a1c1b",
            "on-surface-variant": "#444748",
            "primary": "#161616",
            "secondary": "#9a442d",
            "outline": "#747878"
          },
          borderRadius: {
            DEFAULT: "1rem",
            full: "9999px"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: rgba(26, 28, 27, 0.65);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-end p-0 sm:p-4">
  <!-- Discard Confirmation Sheet -->
  <div class="w-full max-w-md mx-auto bg-surface-container-lowest rounded-t-[28px] sm:rounded-b-[28px] p-6 shadow-[0_-12px_40px_rgba(0,0,0,0.22)] flex flex-col">
    <!-- Handle -->
    <div class="w-10 h-1 rounded-full bg-surface-dim mx-auto mb-5"></div>

    <div class="text-left mb-6">
      <h2 class="text-[20px] font-extrabold text-primary tracking-tight">Discard changes?</h2>
      <p class="text-[14px] text-on-surface-variant mt-1">Your update to Current hasn’t been saved.</p>
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-2.5">
      <button class="w-full min-h-[48px] py-3 rounded-full bg-primary text-white font-bold text-[15px] hover:bg-black active:scale-[0.98] transition-all flex items-center justify-center">
        Keep editing
      </button>
      <button class="w-full min-h-[48px] py-3 rounded-full bg-surface-container text-secondary font-bold text-[15px] hover:bg-surface-container-high active:scale-[0.98] transition-all flex items-center justify-center">
        Discard
      </button>
    </div>
  </div>
</body>
</html>
