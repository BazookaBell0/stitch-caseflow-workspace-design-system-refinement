<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Caseflow - Preparing Draft</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            paper: '#F9F9F7',
            carbon: '#161616',
            muted: '#5F6160',
            borderLight: '#E8E8E4',
            clay: '#A45338',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-spinner">
    /* Subtle, elegant refined spinner */
    @keyframes subtleSpin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .quiet-spinner {
      border: 2.5px solid #E6E6E1;
      border-top-color: #161616;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: subtleSpin 0.9s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
  </style>
</head>
<body class="bg-[#121212] min-h-screen flex items-center justify-center p-0 sm:p-4 font-sans antialiased select-none">
<!-- BEGIN: MobileFrameWrapper -->
<!-- Container mimicking screen framing for mobile presentation -->
<div class="w-full max-w-[393px] h-[852px] bg-paper shadow-2xl relative flex flex-col justify-between overflow-hidden sm:rounded-[44px] border sm:border-[#2a2a2a]" data-purpose="mobile-viewport">
<!-- BEGIN: SystemStatusBar -->
<div class="w-full h-11 pt-3 px-7 flex justify-between items-center text-carbon shrink-0" data-purpose="status-bar">
<!-- Status Bar Time -->
<span class="text-[14px] font-semibold tracking-tight">9:41</span>
<!-- Status Bar Right Icons -->
<div class="flex items-center space-x-1.5 opacity-90">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C2.89 16.48 2 14.34 2 12c0-5.52 4.48-10 10-10s10 4.48 10 10c0 2.34-.89 4.48-2.35 6.23l-.62-.62C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"></path>
<circle cx="12" cy="12" r="2.5"></circle>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-carbon rounded-[3px] p-0.5 flex items-center">
<div class="h-full w-full bg-carbon rounded-[1px]"></div>
</div>
</div>
</div>
<!-- END: SystemStatusBar -->
<!-- BEGIN: TopNavigationHeader -->
<header class="w-full px-5 py-3 flex items-center justify-between shrink-0" data-purpose="page-header">
<!-- Back Action Button -->
<button aria-label="Go back" class="flex items-center space-x-1.5 text-carbon hover:opacity-75 transition-opacity -ml-1 focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-[2.25] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[15px] font-medium tracking-tight">Back</span>
</button>
<!-- Center Category Title -->
<span class="text-[11px] font-bold uppercase tracking-[0.14em] text-carbon/60 select-none pr-8">
        Privacy Review
      </span>
<!-- Empty spacer to balance header layout -->
<div aria-hidden="true" class="w-4"></div>
</header>
<!-- END: TopNavigationHeader -->
<!-- BEGIN: MainContentArea -->
<main class="flex-1 flex flex-col items-center justify-center px-8 pb-20 text-center" data-purpose="processing-content">
<!-- Loading Indicator -->
<div aria-hidden="true" class="mb-6 flex justify-center items-center">
<div class="quiet-spinner"></div>
</div>
<!-- Main Headline -->
<h1 class="text-[25px] font-bold text-carbon tracking-tight leading-tight">
        Preparing draft
      </h1>
<!-- Supporting Explanation -->
<p class="mt-2 text-[15px] leading-relaxed text-muted font-normal max-w-[280px]">
        Creating a documentation proposal from the protected capture…
      </p>
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: ScreenFooterArea -->
<footer class="w-full shrink-0 flex flex-col items-center pb-2" data-purpose="footer-spacing">
<!-- Home Indicator Bar for standard iOS layout -->
<div class="w-32 h-1 bg-carbon/20 rounded-full mb-1"></div>
</footer>
<!-- END: ScreenFooterArea -->
</div>
<!-- END: MobileFrameWrapper -->
</body></html>
