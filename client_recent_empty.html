<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Recent — Jordan M. (Empty) — Caseflow</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f9f9f7",
            "surface-dim": "#dadad8",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f4f2",
            "surface-container": "#eeeeec",
            "surface-container-high": "#e8e8e6",
            "on-surface": "#1a1c1b",
            "on-surface-variant": "#444748",
            "outline": "#747878",
            "outline-variant": "#c4c7c7",
            "primary": "#000000",
            "on-primary": "#ffffff",
            "secondary": "#9a442d",
            "on-secondary": "#ffffff"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f9f9f7;
        color: #1a1c1b;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overscroll-behavior-y: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
  </style>
</head>
<body class="bg-surface font-sans text-on-surface flex flex-col min-h-screen">
  <!-- Contextual Chrome Header -->
  <header class="fixed top-0 w-full z-40 pt-safe bg-surface/90 backdrop-blur-xl border-b border-surface-container">
    <div class="max-w-md mx-auto h-16 px-5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="#client-overview" class="min-h-[44px] min-w-[44px] -ml-2 flex items-center justify-center text-on-surface hover:text-on-surface-variant transition-colors" aria-label="Back to Jordan M.">
          <span class="material-symbols-outlined text-[22px]">arrow_back</span>
        </a>
        <div class="flex items-center gap-1.5">
          <span class="text-[17px] font-bold text-primary tracking-tight">Jordan M.</span>
        </div>
      </div>
      <span class="text-[12px] font-semibold text-on-surface-variant bg-surface-container px-2.5 py-1 rounded-full">Youth Outreach</span>
    </div>
  </header>

  <!-- Empty State Body -->
  <main class="flex-1 w-full max-w-md mx-auto pt-20 pb-28 px-5 flex flex-col">
    <!-- Title -->
    <div class="pt-2 pb-5">
      <h1 class="text-[28px] font-extrabold text-primary tracking-tight leading-tight">Recent</h1>
      <p class="text-[14px] text-on-surface-variant mt-0.5">Working notes and recent captures</p>
    </div>

    <!-- Calm Minimal Empty State -->
    <div class="flex-1 flex flex-col items-center justify-center text-center py-12 px-4">
      <div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-outline mb-4">
        <span class="material-symbols-outlined text-[24px]">stylus_note</span>
      </div>
      <h2 class="text-[19px] font-bold text-primary tracking-tight mb-1.5">No recent captures</h2>
      <p class="text-[14px] text-on-surface-variant max-w-xs leading-relaxed mb-6">
        Quick Captures for this client will appear here as you save them.
      </p>
      <button class="min-h-[48px] px-6 rounded-full bg-primary text-on-primary text-[14px] font-semibold flex items-center gap-2 active:scale-95 transition-transform shadow-sm">
        <span class="material-symbols-outlined text-[18px]">add</span>
        <span>Capture something</span>
      </button>
    </div>
  </main>

  <!-- Locked Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-40 pb-safe px-5 pointer-events-none mb-3" data-active-classes="text-primary font-bold">
    <div class="max-w-md mx-auto pointer-events-auto h-16 bg-surface-container-lowest/90 backdrop-blur-xl rounded-full shadow-[0_16px_36px_-6px_rgba(26,28,27,0.08),0_4px_12px_-2px_rgba(26,28,27,0.03)] px-4 flex items-center justify-between border border-surface-container/60">
      <a class="min-h-[44px] min-w-[44px] flex-1 flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" href="#">
        <span class="material-symbols-outlined text-[22px]">notifications_active</span>
        <span class="text-[11px] font-semibold mt-0.5">Today</span>
      </a>
      <a class="min-h-[44px] min-w-[44px] flex-1 flex flex-col items-center justify-center text-primary font-bold transition-colors" href="#">
        <span class="material-symbols-outlined text-[22px]">folder_shared</span>
        <span class="text-[11px] font-bold mt-0.5">Caseload</span>
      </a>
      <div class="flex items-center justify-center px-1">
        <a aria-label="Quick capture for Jordan M." class="min-h-[44px] min-w-[44px] w-12 h-12 rounded-full bg-secondary text-on-secondary shadow-[0_6px_16px_rgba(154,68,45,0.28)] flex items-center justify-center active:scale-95 transition-transform" href="#">
          <span class="material-symbols-outlined text-[24px]">add</span>
        </a>
      </div>
      <a class="min-h-[44px] min-w-[44px] flex-1 flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" href="#">
        <span class="material-symbols-outlined text-[22px]">checklist</span>
        <span class="text-[11px] font-semibold mt-0.5">Tasks</span>
      </a>
    </div>
  </nav>
</body>
</html>
