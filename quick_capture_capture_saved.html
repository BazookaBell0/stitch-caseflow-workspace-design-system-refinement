<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Capture Saved - Caseflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'canvas': '#F9F9F7',
        'surface-recessed': '#F4F4F2',
        'surface-grouped': '#EEEEEC',
        'surface-elevated': '#FFFFFF',
        'carbon': '#161616',
        'secondary': '#5F6160',
        'tertiary': '#858784',
        'divider': '#E8E8E5',
        'clay': '#9A442D',
        'clay-soft': '#FFDAD2',
      },
      fontFamily: {
        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
      },
      borderRadius: {
        'sheet': '24px',
        'control': '16px',
        'pill': '9999px',
      }
    }
  }
};
</script>
<style>
@layer base {
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background-color: #161616;
    color: #161616;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  ::-webkit-scrollbar { display: none; }
}
</style>
</head>
<body class="bg-carbon/60 flex justify-center items-end sm:items-center min-h-screen p-0 sm:p-4 antialiased selection:bg-clay-soft">

  <!-- Mobile Frame / Sheet Container -->
  <div class="relative w-full max-w-[400px] h-[92vh] sm:h-[840px] bg-canvas rounded-t-sheet sm:rounded-sheet shadow-[0_-12px_40px_rgba(0,0,0,0.28)] flex flex-col overflow-hidden border border-divider/60 justify-between">
    
    <!-- Top Quiet Status Bar -->
    <header class="px-5 pt-4 pb-3 flex items-center justify-end border-b border-divider/50 bg-canvas/95 shrink-0">
      <button onclick="history.back()" class="w-9 h-9 rounded-full flex items-center justify-center text-secondary hover:text-carbon hover:bg-surface-grouped transition-colors" aria-label="Close">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </header>

    <!-- Main Reassuring Confirmation Surface (Centered & Calm) -->
    <main class="flex-1 flex flex-col justify-center px-6 py-8 items-center text-center">
      
      <!-- Minimalist Reassuring Indicator (No confetti, no giant check) -->
      <div class="w-14 h-14 rounded-full bg-clay/10 text-clay flex items-center justify-center mb-5 shadow-sm border border-clay/20">
        <span class="material-symbols-outlined text-[28px]">check</span>
      </div>

      <!-- Clear Calm Headline -->
      <h1 class="text-[28px] font-extrabold text-carbon tracking-tight mb-2">Capture saved</h1>
      
      <!-- Supporting Text adhering strictly to working memory principles -->
      <p class="text-[16px] text-secondary leading-relaxed max-w-[280px]">
        Added to <strong class="font-semibold text-carbon">Jordan M.</strong>’s recent activity.
      </p>

      <!-- Note Preview Card (Tactile printed excerpt of the captured note) -->
      <div class="w-full mt-8 p-4 rounded-control bg-surface-elevated border border-divider shadow-[0_2px_8px_rgba(22,22,22,0.02)] text-left">
        <div class="flex items-center justify-between text-[13px] text-tertiary mb-2 font-normal">
          <span class="">Captured</span>
          <span class="text-[12px]">Just now</span>
        </div>
        <p class="text-[14px] text-carbon leading-normal line-clamp-3 font-normal">
          “Met Jordan after school. He said the bus didn’t arrive this morning. We talked about trying the earlier route tomorrow…”
        </p>
      </div>

    </main>

    <!-- Bottom Actions: Primary 'Done' (easiest way out) + Secondary 'Prepare documentation' -->
    <footer class="px-5 py-5 bg-canvas border-t border-divider/60 flex flex-col gap-3 shrink-0"><button onclick="history.back()" class="w-full h-13 py-3.5 px-6 rounded-pill bg-carbon text-surface-elevated font-bold text-[16px] tracking-tight flex items-center justify-center shadow-[0_4px_16px_rgba(22,22,22,0.15)] active:scale-[0.98] transition-all hover:bg-carbon/90"><span class="">Done</span></button><button onclick="const toast = this.querySelector('.label-text'); if(toast){ toast.textContent = 'Added to To document'; this.classList.add('bg-surface-grouped'); }" class="w-full h-12 py-3 px-6 rounded-pill bg-surface-recessed hover:bg-surface-grouped text-carbon font-semibold text-[15px] tracking-tight flex items-center justify-center gap-1.5 border border-divider/80 active:scale-[0.98] transition-all"><span class="material-symbols-outlined text-[16px] text-secondary">bookmark_add</span><span class="label-text">Document later</span></button><button class="w-full py-2 text-center text-secondary hover:text-carbon font-semibold text-[14px] tracking-tight flex items-center justify-center gap-1 transition-colors"><span class="">Prepare documentation now</span><span class="material-symbols-outlined text-[16px]">arrow_forward</span></button></footer>

  </div>







</body></html>
