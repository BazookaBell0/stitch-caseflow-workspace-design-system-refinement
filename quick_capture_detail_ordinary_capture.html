<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Quick Capture Detail — Ordinary Capture — Caseflow</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f9f9f7",
            "surface-dim": "#dadad8",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f4f2",
            "surface-container": "#eeeeec",
            "surface-container-high": "#e8e8e6",
            "on-surface": "#1a1c1b",
            "on-surface-variant": "#444748",
            "outline": "#747878",
            "primary": "#000000",
            "on-primary": "#ffffff",
            "secondary": "#9a442d",
            "on-secondary": "#ffffff"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: transparent;
        color: #1a1c1b;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    }
  </style>
</head>
<body class="bg-black/45 font-sans min-h-screen flex flex-col justify-end backdrop-blur-[2px]">
  <!-- Dimmed Top Area (Dismiss trigger) -->
  <div class="flex-1 w-full" onclick="history.back()"></div>

  <!-- Focused Mobile Bottom Sheet -->
  <div class="w-full max-w-md mx-auto bg-surface-container-lowest rounded-t-[28px] shadow-[0_-12px_40px_rgba(26,28,27,0.18)] px-5 pt-3 pb-safe z-50 flex flex-col">
    <!-- Sheet Drag Handle -->
    <div class="w-10 h-1 rounded-full bg-surface-container-highest mx-auto mb-3"></div>

    <!-- Header & Client Context -->
    <div class="flex items-start justify-between pb-3 border-b border-surface-container">
      <div class="flex flex-col">
        <h2 class="text-[18px] font-bold text-primary tracking-tight">Quick Capture</h2>
        <div class="flex items-center gap-1.5 mt-0.5 text-[13px] text-on-surface-variant">
          <span class="font-semibold text-primary">Jordan M.</span>
          <span>·</span>
          <span>Today, 10:15 AM</span>
        </div>
      </div>
      <button aria-label="Close sheet" class="min-h-[44px] min-w-[44px] -mr-2 flex items-center justify-center text-outline hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>

    <!-- Full Working Capture Note -->
    <div class="py-5">
      <div class="bg-surface-container-low rounded-2xl p-4 border border-surface-container">
        <p class="text-[16px] leading-relaxed text-on-surface font-normal">
          “Checked in about school paperwork. Jordan said one form still needs to be returned by guardian before Thursday’s registration block.”
        </p>
      </div>
      <p class="text-[12px] text-outline mt-2 px-1">
        Captured in working memory. Not part of official documentation.
      </p>
    </div>

    <!-- Ordinary Capture Actions (Not currently in documentation queue) -->
    <div class="flex flex-col gap-2.5 pb-6">
      <button class="w-full min-h-[50px] rounded-full bg-secondary text-on-secondary font-semibold text-[15px] flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(154,68,45,0.22)] active:scale-[0.98] transition-transform">
        <span class="material-symbols-outlined text-[18px]">edit_note</span>
        <span>Prepare documentation</span>
      </button>

      <button class="w-full min-h-[46px] rounded-full bg-surface-container text-on-surface font-semibold text-[14px] flex items-center justify-center gap-1.5 hover:bg-surface-container-high active:scale-[0.98] transition-all">
        <span class="material-symbols-outlined text-[18px] text-on-surface-variant">schedule</span>
        <span>Document later</span>
      </button>
    </div>
  </div>
</body>
</html>
