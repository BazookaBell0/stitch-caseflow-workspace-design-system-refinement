<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Task Detail — Open — Caseflow</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f9f9f7",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f4f2",
            "surface-container": "#eeeeec",
            "surface-container-high": "#e8e8e6",
            "on-surface": "#1a1c1b",
            "on-surface-variant": "#444748",
            "outline": "#747878",
            "outline-variant": "#c4c7c7",
            "primary": "#161616",
            "on-primary": "#ffffff",
            "secondary": "#9a442d",
            "on-secondary": "#ffffff",
            "secondary-fixed": "#ffdbd2",
            "on-secondary-fixed-variant": "#7c2e19"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: rgba(26, 28, 27, 0.45);
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    }
  </style>
</head>
<body class="flex flex-col justify-end min-h-screen">
  <!-- Backdrop -->
  <div class="flex-1 w-full" onclick="history.back()"></div>

  <!-- Focused Bottom Sheet: Open Task Detail -->
  <div class="w-full max-w-md mx-auto bg-surface rounded-t-3xl shadow-[0_-12px_40px_rgba(26,28,27,0.22)] border-t border-surface-container flex flex-col p-6 pb-safe animate-in slide-in-from-bottom duration-200">
    <!-- Drag Handle -->
    <div class="w-10 h-1 rounded-full bg-outline-variant mx-auto mb-4"></div>

    <!-- Header -->
    <div class="flex items-start justify-between mb-4">
      <div>
        <h2 class="text-xl font-bold text-primary tracking-tight">Task</h2>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span class="text-xs text-on-surface-variant">Client:</span>
          <span class="text-xs font-semibold text-primary bg-surface-container px-2 py-0.5 rounded-full">Jordan M.</span>
        </div>
      </div>
      <button onclick="history.back()" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-outline hover:text-primary transition-colors" aria-label="Close">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>

    <!-- Task Information Card -->
    <div class="bg-surface-container-lowest border border-surface-container rounded-2xl p-4 shadow-sm flex flex-col space-y-3.5 my-2">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-outline block mb-1">Task</span>
        <p class="text-[16px] font-semibold text-primary leading-snug">Confirm bus pass</p>
      </div>

      <div class="h-px bg-surface-container w-full"></div>

      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-outline block mb-1">Due date</span>
        <div class="inline-flex items-center gap-1.5 bg-surface-container px-2.5 py-1 rounded-full text-xs font-semibold text-primary">
          <span class="material-symbols-outlined text-[14px] text-secondary">today</span>
          <span>Today</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex flex-col space-y-2 mt-6">
      <button class="w-full h-12 rounded-full bg-secondary text-on-secondary font-bold text-[15px] shadow-[0_6px_16px_rgba(154,68,45,0.24)] hover:bg-[#853924] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]">check</span>
        <span>Complete task</span>
      </button>
      <button class="w-full h-11 rounded-full bg-surface-container hover:bg-surface-container-high text-primary font-semibold text-sm active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined text-[16px]">edit</span>
        <span>Edit</span>
      </button>
      <button onclick="history.back()" class="w-full h-10 rounded-full text-on-surface-variant font-medium text-sm hover:text-primary active:scale-[0.98] transition-all flex items-center justify-center">
        Close
      </button>
    </div>
  </div>
</body>
</html>
